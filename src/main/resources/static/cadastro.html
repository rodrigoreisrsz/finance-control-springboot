<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — Finanças Pessoais</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <p class="dashboard__month">Finanças Pessoais</p>
        <h1 class="login-card__titulo">Criar conta</h1>

        <form id="formCadastro" class="modal__form">
            <div class="campo">
                <label for="cadastroNome">Nome</label>
                <input type="text" id="cadastroNome" required maxlength="80" autocomplete="name" autofocus>
            </div>

            <div class="campo">
                <label for="cadastroEmail">E-mail</label>
                <input type="email" id="cadastroEmail" required autocomplete="email">
            </div>

            <div class="campo">
                <label for="cadastroSenha">Senha</label>
                <div class="campo__senha">
                    <input type="password" id="cadastroSenha" required minlength="8" autocomplete="new-password">
                    <button type="button" class="campo__toggle" id="toggleCadastroSenha"
                            aria-pressed="false" aria-label="Mostrar senha">Mostrar</button>
                </div>
                <small class="campo__dica">Mínimo de 8 caracteres.</small>
            </div>

            <div class="campo">
                <label for="cadastroConfirma">Confirmar senha</label>
                <input type="password" id="cadastroConfirma" required autocomplete="new-password">
            </div>

            <p class="modal__erro" id="cadastroErro" role="alert"></p>

            <button type="submit" class="btn-primary modal__submit" id="btnCadastro">Criar conta</button>
        </form>

        <p class="login-card__rodape">
            Já tem conta? <a href="login.html">Entrar</a>
        </p>
    </div>
</div>

<script src="cadastro.js"></script>
</body>
</html>
