services:
  bancofinanceiro:
    image: postgres:15
    container_name: postgres_db_controlefinanceiroNovo
    environment:
      POSTGRES_USER: app_service
      POSTGRES_PASSWORD: rdrayanezapzapzap22233337777
      POSTGRES_DB: FinanceiroNovo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_final:/var/lib/postgresql/data
    networks:
      - financeiro_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_service -d FinanceiroNovo" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  financeiro_api2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeiro_api
    depends_on:
      bancofinanceiro:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - financeiro_net
    tty: true

volumes:
  postgres_data_final: # Mudamos o nome do volume para forçar o docker a criar um novo sem cache

networks:
  financeiro_net:
    driver: bridge
