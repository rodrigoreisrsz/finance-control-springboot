services:
  bancofinanceiro:
    image: postgres:15
    container_name: postgres_db_controlefinanceiroNovo
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_final:/var/lib/postgresql/data
    networks:
      - financeiro_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  financeiro_api2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeiro_api
    depends_on:
      bancofinanceiro:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bancofinanceiro:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - financeiro_net

volumes:
  postgres_data_final:

networks:
  financeiro_net:
    driver: bridge