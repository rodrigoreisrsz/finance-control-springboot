$kind: http-request
description: ""
url: http://localhost:8080/user/login
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"email\": \"rodrigo2@gmail.com\",\r

    \  \"password\": \"12345678\"\r

    \    \r

    }\r

    \  \r\n"
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      if (body.jwt) {
          pm.environment.set('token', body.jwt);
          console.log('JWT token saved to environment variable {{token}}');
      } else {
          console.warn('Login response did not contain a jwt field:', body);
      }
order: 3000
